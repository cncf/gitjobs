name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test-server:
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt
      - name: Install Tailwind CSS
        run: |
          wget -O /usr/local/bin/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v4.0.17/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- --deny warnings
      - name: Run rustfmt
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test

  lint-templates:
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install djlint
        run: pip install djlint==1.44.2
      - name: Run djlint
        run: |
          djlint \
            --reformat \
            --configuration gitjobs-server/templates/.djlintrc \
            gitjobs-server/templates

  check-js-files-format:
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Run prettier
        uses: creyD/prettier_action@v4.6
        with:
          dry: true
          prettier_options: --check gitjobs-server/static/js/**/*.js tests/unit/**/*.js tests/unit/**/*.mjs --config gitjobs-server/static/js/.prettierrc.yaml

  test-frontend-unit:
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/unit/package-lock.json
      - name: Install dependencies
        working-directory: tests/unit
        run: npm ci
      - name: Install Chromium
        working-directory: tests/unit
        run: npx playwright install --with-deps chromium
      - name: Run frontend unit tests
        working-directory: tests/unit
        run: npm test

  test-database:
    runs-on:
      labels: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container: ghcr.io/cncf/gitjobs/db-tests
    services:
      postgres:
        image: ghcr.io/cncf/gitjobs/postgres-db-tests
        env:
          POSTGRES_DB: tests
          POSTGRES_PASSWORD: tests
          POSTGRES_USER: tests
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Apply database migrations
        working-directory: ./database/migrations
        run: TERN_CONF=../../../.github/workflows/tern.conf PGPORT=${{ job.services.postgres.ports[5432] }} ./migrate.sh
      - name: Install pgtap database extension
        run: PGPASSWORD=tests psql -h postgres -p ${{ job.services.postgres.ports[5432] }} -U tests tests -c 'create extension pgtap;'
      - name: Run database tests
        working-directory: ./database/tests
        run: PGPASSWORD=tests pg_prove --host postgres --dbname tests --username tests --verbose schema/*.sql functions/*/*.sql
