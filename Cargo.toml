[workspace]
resolver = "3"
members = [
    "gitjobs-server",
    "gitjobs-syncer"
]

[workspace.package]
version = "0.0.1"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
anyhow = "1.0.104"
askama = { version = "0.16.1", features = ["serde_json"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-login = "0.18.0"
axum-extra = { version = "0.12.6", features = ["form", "typed-header"] }
axum-messages = "0.8.0"
cached = { version = "4.1.0", features = ["async"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
deadpool-postgres = { version = "0.14.2", features = ["serde"] }
emojis = "0.9.1"
figment = { version = "0.10.19", features = ["yaml", "env"] }
futures = "0.3.34"
garde = { version = "0.23.0", features = ["derive", "url", "email"] }
human_format = "1.2.1"
image = "0.25.10"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls-tls"] }
markdown = "1.0.0"
mime_guess = "2.0.5"
minify-html = "0.18.1"
mockall = "0.15.0"
num-format = "0.4.4"
oauth2 = "5.0.0"
openidconnect = { version = "4.1.0", features = ["accept-rfc3339-timestamps"] }
openssl = { version = "0.10.82", features = ["vendored"] }
palette = "0.7.7"
password-auth = "1.0.0"
percent-encoding = "2.3.2"
postgres-openssl = "0.5.3"
quick-xml = "0.42.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_html_form = "0.4.1"
serde_json = "1.0.154"
serde_qs = { version = "1.1.3", features = ["axum"] }
serde_with = "3.24.0"
sha2 = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-postgres = { version = "0.7.18", features = [
    "with-chrono-0_4",
    "with-serde_json-1",
    "with-time-0_3",
    "with-uuid-1",
] }
tokio-util = { version = "0.7.20", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["auth", "fs", "set-header", "trace"] }
tower-sessions = { version = "0.14.0", features = ["signed"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
which = "8.0.6"
